# Weekly automatic retraining of the cross-encoder. See cross-encoder/README.md
# ("Automatic retraining") for the one-time setup (4 repository secrets).
#
# Safe by default: scheduled runs may promote a new model ONLY if it passes the
# gate in cross-encoder/retrain_gate.py; manual runs are dry runs unless you
# tick "promote". Never put secret values in this file.
name: Retrain cross-encoder

on:
  schedule:
    - cron: "17 3 * * 1"   # 03:17 UTC (08:47 IST) every Monday
  workflow_dispatch:
    inputs:
      promote:
        description: "Upload and switch the Space if the new model passes the gate"
        type: boolean
        default: false
      synthetic_limit:
        description: "Document chunks to generate questions for (Gemini free tier is slow)"
        default: "100"

permissions:
  contents: read

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: cross-encoder
    env:
      PROMOTE: ${{ github.event_name == 'schedule' || inputs.promote }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python packages (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentence-transformers "psycopg[binary]" requests huggingface_hub

      - name: Download real usage feedback (optional)
        continue-on-error: true
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          npm install --no-audit --no-fund
          node download_feedback.mjs feedback.jsonl

      - name: Generate synthetic pairs from the app's documents
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SYN_LIMIT: ${{ inputs.synthetic_limit || '100' }}
        run: python generate_synthetic_data.py --limit "$SYN_LIMIT" --out synthetic.jsonl --quiet

      - name: Build public data and the hand-made test set
        run: |
          python build_public_dataset.py --include-tatqa
          python qa_to_training.py --out handmade_test.jsonl

      - name: Combine and split
        run: python combine_and_split.py --synthetic synthetic.jsonl --feedback feedback.jsonl --public public_train.jsonl --val-fraction 0.2

      - name: Train, compare with the live model, maybe promote
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python retrain.py
